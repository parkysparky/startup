<!-- 
CSS practice

    [X] 1. Make the background for the body black, header dark gray, and sections gray.
    [X] 2. Add color to the header text.
    [X] 3. Add a bottom border to the h1 text.
    [X] 4. Set the font to be a sans-serif font. 
            [X] Right align the footer.
    [X] 5. Animate the section elements. 
-->

<style>
    

  body {
    font-family: sans-serif;
    background-color: black;

    header {
      background-color: darkgray;
    }

    header h1 {
      color: aqua;
      border-bottom: 1px solid white; 
        
    }

    section {
      background-color: gray;

      animation-name: fly-in;
      animation-duration: 1s;
      animation-iteration-count: 1;
    }

    footer {
      text-align: right;
    }

  }

  @keyframes fly-in {
    0% {
      transform: translateX(-100%);
    }
    100% {
      transform: translateX(0);
    }
  }


</style>

<body>
  <header>
    <h1>Header</h1>
    <nav>Navigation
      <div>Div</div>
      <div>Div</div>
    </nav>
  </header>

  <main>
    <section class="fly-in">
      <h2>Section</h2>
      <ul>
        <li>List</li>
        <li>List</li>
        <li>List</li>
      </ul>
    </section>
    <section class="fly-in">
      <h2>Section</h2>
      <table id="table-data">
        <tr>
          <th>Table</th>
          <th>Table</th>
          <th>Table</th>
        </tr>
        <tr>
          <td>table</td>
          <td>table</td>
          <td>table</td>
        </tr>
      </table>
    </section>
  </main>

  <footer>
    <div>Footer</div>
  </footer>
</body>
